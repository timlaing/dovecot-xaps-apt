name: Publish APT Repository

# Rebuilds the APT index from published release assets of the two source
# repositories. It can be triggered manually (workflow_dispatch) or
# automatically via repository_dispatch from the source release workflows.
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: "dovecot-xaps-plugin release tag (e.g. v1.0.0)"
        required: false
        default: ""
      daemon_ref:
        description: "dovecot-xaps-daemon release tag (e.g. v0.0.1)"
        required: false
        default: ""
  repository_dispatch:
    types: [apt-release]

concurrency:
  # This workflow always publishes state to main, so key the group by the
  # branch being mutated (main) rather than the ref the run was triggered on.
  # A dispatch from a non-main ref would otherwise get a different group and
  # could overlap a main publish. The job is gated to refs/heads/main below.
  group: publish-main
  # Queue instead of cancelling so a run never aborts mid-push of the APT
  # state and leaves the repository half updated. Runs are short and rare.
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    # Only ever mutate the released state from main; a workflow_dispatch on a
    # feature branch is a no-op (repository_dispatch always targets main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up SSH deploy key
        # The repo's main ruleset lists Deploy keys as bypass actors but not
        # the GitHub Actions app, so pushing over HTTPS with GITHUB_TOKEN is
        # rejected. State commits must be authenticated as the deploy key.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Trust github.com host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Sync to latest main
        # Reset local state to the last committed APT state on origin/main.
        # Runs are serialized by the concurrency group, so syncing before
        # importing/exporting guarantees the generated snapshot is based on
        # the newest db/dists/pool and pushes fast-forward cleanly. Do not
        # rebase or reset again after reprepro writes state.
        run: |
          set -euo pipefail
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git fetch origin
          # checkout may leave a detached HEAD; -B (re)creates the local branch
          # from origin/main deterministically, and also resets any drift.
          git checkout -B main origin/main

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro lintian dpkg-dev gpg pinentry-curses

      - name: Configure GPG for non-interactive signing
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' > ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent

      - name: Import signing key
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          echo "${APT_SIGNING_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback --import
          gpg --batch --list-secret-keys --with-fingerprint

      - name: Download plugin package
        if: ${{ inputs.plugin_ref != '' || github.event.client_payload.repo == 'timlaing/dovecot-xaps-plugin' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.plugin_ref || (github.event.client_payload.repo == 'timlaing/dovecot-xaps-plugin' && github.event.client_payload.ref) || '' }}
        run: |
          mkdir -p /tmp/pkgs
          gh release download "${REF}" \
            --repo timlaing/dovecot-xaps-plugin \
            --pattern "*.deb" \
            --dir /tmp/pkgs

      - name: Download daemon package
        if: ${{ inputs.daemon_ref != '' || github.event.client_payload.repo == 'timlaing/dovecot-xaps-daemon' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.daemon_ref || (github.event.client_payload.repo == 'timlaing/dovecot-xaps-daemon' && github.event.client_payload.ref) || '' }}
        run: |
          mkdir -p /tmp/pkgs
          gh release download "${REF}" \
            --repo timlaing/dovecot-xaps-daemon \
            --pattern "*.deb" \
            --dir /tmp/pkgs

      - name: Lint packages
        run: |
          set -euo pipefail
          if ls /tmp/pkgs/*.deb >/dev/null 2>&1; then
            for deb in /tmp/pkgs/*.deb; do
              echo "Linting ${deb}"
              dpkg-deb --info "${deb}"
              lintian --fail-on error "${deb}"
            done
          else
            echo "No packages downloaded; nothing to publish."
          fi

      - name: Import packages with reprepro
        run: |
          set -euo pipefail
          if ls /tmp/pkgs/*.deb >/dev/null 2>&1; then
            for deb in /tmp/pkgs/*.deb; do
              echo "Importing ${deb}"
              reprepro --basedir . includedeb stable "${deb}"
            done
            reprepro --basedir . check
            reprepro --basedir . export
          else
            echo "No packages to import; skipping."
          fi

      - name: Assert published set
        # Regression guard: db/dists/pool are committed state, so an import of
        # only one producer must never remove the other from the snapshot. The
        # full set is enforced on amd64 always, and on other declared arches
        # only when their index exists and is non-empty.
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        run: |
          set -euo pipefail
          # Derive declared architectures from conf/distributions (the source of
          # truth) so the guard tracks config changes instead of drifting from a
          # hard-coded list. Drop the optional "source" token.
          arches="$(awk '/^Architectures:/{for (i=2; i<=NF; i++) if ($i != "source") printf "%s ", $i}' conf/distributions)"
          # amd64 is authoritative today; the source repos only publish amd64
          # debs. Enforce the full set on amd64 unconditionally, and enforce it
          # on additional declared arches only when their index exists and
          # carries packages (as reconcile.yml already tolerates).
          for arch in ${arches}; do
            index="dists/stable/main/binary-${arch}/Packages"
            if [ "${arch}" != "amd64" ] && [ ! -s "${index}" ]; then
              echo "${arch} index is empty/absent; skipping arch assertion."
              continue
            fi
            for pkg in xapsd dovecot-xaps-plugin; do
              if ! grep -q "^Package: ${pkg}$" "${index}"; then
                echo "Missing ${pkg} in ${index}"
                exit 1
              fi
            done
          done
          echo "Published set is complete."

      - name: Ensure no private keys in APT state
        # Scan the repo state (db, dists, pool) for private key material before
        # it is committed and pushed. Grabbing credentials here beats relying on
        # the post-staging scan, which runs after state is already persisted.
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        run: |
          set -euo pipefail
          # grep exits 1 on "no match" but >1 on real scan errors (missing dir,
          # unreadable file). Treat only 1 as clean so a broken scan never
          # implies the state is free of keys, then commit/push anyway.
          set +e
          grep -rIl --include="*" "PRIVATE KEY" db dists pool public-key.asc 2>&1
          scan_rc=$?
          set -e
          if [ "${scan_rc}" -eq 1 ]; then
            echo "No private key material in APT state."
          elif [ "${scan_rc}" -eq 0 ]; then
            echo "Private key material found in APT state"
            exit 1
          else
            echo "Private-key scan failed (grep exit ${scan_rc})" >&2
            exit 1
          fi

      - name: Verify InRelease signature
        # Verify the freshly exported, signed InRelease against the published
        # public key before any of the state is committed/pushed. Signing
        # misconfiguration must abort the run before main is mutated.
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        run: |
          gpg -o /tmp/apt-keyring.gpg --dearmor public-key.asc
          gpgv --keyring /tmp/apt-keyring.gpg dists/stable/InRelease

      - name: Commit and push APT state
        # Persist db/dists/pool so the next run merges instead of rebuilding a
        # snapshot from scratch. Without this the deployed index only contains
        # the packages imported by the most recent dispatch. Push over SSH with
        # the deploy key so the main ruleset's Deploy-key bypass applies rather
        # than the GITHUB_TOKEN (GitHub Actions app), which cannot bypass.
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db dists pool public-key.asc
          if git diff --cached --quiet; then
            echo "No APT state changes to commit."
          else
            git commit -m "chore: update APT repository state [skip ci]"
            git push origin HEAD:main
            echo "APT state committed and pushed."
          fi

      - name: Stage Pages artifact
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pages
          cp -r dists pool conf public-key.asc /tmp/pages/
          touch /tmp/pages/.nojekyll

      - name: Ensure no private keys in artifact
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        run: |
          set -euo pipefail
          set +e
          grep -rIl --include="*" "PRIVATE KEY" /tmp/pages 2>&1
          scan_rc=$?
          set -e
          if [ "${scan_rc}" -eq 1 ]; then
            echo "No private key material in artifact."
          elif [ "${scan_rc}" -eq 0 ]; then
            echo "Private key material found in artifact"
            exit 1
          else
            echo "Private-key scan failed (grep exit ${scan_rc})" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'repository_dispatch' || inputs.plugin_ref != '' || inputs.daemon_ref != '' }}
        id: deployment
        uses: actions/deploy-pages@v5
