name: Check
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  editable:
    runs-on: ubuntu-latest
    name: Editable PR
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the check
        if: github.event_name == 'pull_request'
        run: python3 -m scripts.check.edits
  integrity:
    name: APT repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository validator
        run: sudo apt-get update && sudo apt-get install --yes reprepro
      - name: Validate committed package indexes and checksums
        run: |
          reprepro --basedir . check
          reprepro --basedir . checkpool
  validation-result:
    name: Validate checks
    needs:
      - editable
      - integrity
      - workflow-tooling
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation incomplete: ' + ', '.join(failed))
          PY
  workflow-tooling:
    name: Workflow tooling coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Measure policy and coordinator coverage
        run: |
          python3 -m pip install --only-binary=:all: PyYAML==6.0.3 coverage==7.11.0
          mkdir -p coverage-workflow
          python3 -m coverage run --branch --source=.github/scripts -m unittest discover -s .github/scripts
          python3 -m coverage xml -o coverage-workflow/python.xml
          node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage-workflow/javascript.lcov .github/scripts/quality-review.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workflow-tooling-coverage
          path: coverage-workflow/
          if-no-files-found: error
          retention-days: 7
